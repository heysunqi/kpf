# kpf release — fires on annotated v* tag push.
#
# Strategy:
#   1. Matrix builds (linux/darwin × amd64/arm64) each produce a tarball
#      via scripts/build-release.sh — same script we run locally, so
#      locally-built artifacts and CI-built artifacts are bit-identical
#      up to the build-time `Date` string in README.txt.
#   2. Each job uploads its tarball as a job artifact.
#   3. A final `release` job downloads every artifact, regenerates
#      SHASUMS256.txt from the canonical artifacts, and uses
#      softprops/action-gh-release to attach them to the GitHub release
#      associated with the tag. Existing assets for the same tag are
#      overwritten — re-running after a fix to scripts/build-release.sh
#      just refreshes the release in place.
#
# Auth: GITHUB_TOKEN is auto-provided by GitHub Actions. It has the
# scopes needed to create a release and upload release assets on the
# repo that owns the workflow.
name: release

on:
  push:
    tags:
      - 'v*.*.*'

# Cancel a previous run of the same tag if you push the tag twice in a
# row (e.g. `git tag -d v0.1.1 && git push origin v0.1.1`). Without this
# you get two parallel uploads racing over the same release assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # required to create / update a release

jobs:
  # ----- matrix: build one tarball per target -----
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
          - target: linux-arm64
            goos: linux
            goarch: arm64
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      # Run the local build script with the version pulled from the
      # tag name (e.g. v0.1.2). We pass the full ref name including
      # the leading 'v' so the produced filenames (kpf-v0.1.2-...tar.gz)
      # match what the release job's files: glob expects below — keeping
      # a single source of truth (github.ref_name) end-to-end.
      - name: Build tarball
        env:
          VERSION: ${{ github.ref_name }}
        run: ./scripts/build-release.sh "$VERSION"

      - name: Locate artifact
        id: locate
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          echo "path=dist/kpf-${VERSION}-${{ matrix.target }}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kpf-${{ matrix.target }}
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error
          retention-days: 14

  # ----- aggregate: collect all artifacts + SHASUMS, publish release -----
  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pull every matrix tarball back so we can hash the exact files
      # we're about to upload — this is the only way SHASUMS256.txt
      # can match what's on the release page.
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: kpf-*
          merge-multiple: true

      - name: List collected artifacts
        run: ls -lh dist/

      # Filenames match github.ref_name verbatim (e.g. kpf-v0.1.2-…),
      # so the glob below lines up with what the build jobs uploaded.
      - name: Generate SHASUMS256.txt
        run: |
          ( cd dist && shasum -a 256 kpf-${{ github.ref_name }}-*.tar.gz > kpf-${{ github.ref_name }}-SHASUMS256.txt )
          cat dist/kpf-${{ github.ref_name }}-SHASUMS256.txt

      # softprops/action-gh-release:
      #   - creates the release if it doesn't exist (matching the tag)
      #   - overwrites existing assets with the same name on rerun
      #   - generates the release body from the template below on first
      #     create; subsequent runs preserve whatever's already there
      #     (use `gh release edit --notes-file` to update the body).
      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: kpf ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/kpf-${{ github.ref_name }}-linux-amd64.tar.gz
            dist/kpf-${{ github.ref_name }}-linux-arm64.tar.gz
            dist/kpf-${{ github.ref_name }}-darwin-amd64.tar.gz
            dist/kpf-${{ github.ref_name }}-darwin-arm64.tar.gz
            dist/kpf-${{ github.ref_name }}-SHASUMS256.txt
          fail_on_unmatched_files: true
          # Replaces assets of the same name on rerun (idempotent reruns).
          # `replace_assets` was renamed to `overwrite_files` in
          # softprops/action-gh-release@v2; old name still works but
          # emits a deprecation warning on every run.
          overwrite_files: true